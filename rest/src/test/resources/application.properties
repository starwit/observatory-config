# is only required for direct test executing.
rest.base-path=/api

# disable Redis for tests
spring.data.redis.active=false

# actuator
management.endpoints.web.base-path=/monitoring
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# show full git properties
management.info.git.mode=full

# Database: PostgreSQL Testcontainer (see de.starwit.persistence.TestcontainersConfiguration)
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=de.starwit.persistence.config.DatabasePhysicalNamingStrategy
spring.jpa.show-sql=true

# required by ObservatoryService constructor
observatory.url=http://localhost:8082/observatory

